[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swing-trader"
version = "0.1.0"
description = "Swing trade setup analyzer with multi-persona reasoning and RAG"
requires-python = ">=3.11"
dependencies = [
    # LLM + orchestration
    "langchain-core>=0.2.0",
    "langchain-openai>=0.1.0",
    "langchain-text-splitters>=0.2.0",
    "langgraph>=0.1.0",
    "langsmith>=0.1.0",
    # Schemas + validation
    "pydantic>=2.7.0",
    # HTTP + data
    "httpx>=0.27.0",
    "python-dateutil>=2.9.0",
    "python-frontmatter>=1.1.0",
    "tenacity>=8.3.0",
    # Vector store
    "qdrant-client>=1.9.0",
    "chromadb>=0.5.0",
    # OpenAI SDK — used as the Ollama OpenAI-compatible client (LLM + embeddings)
    # Also works with real OpenAI if swapping back; just change clients.py
    "openai>=1.30.0",
    # Reranker
    "sentence-transformers>=3.0.0",
    # Database
    "asyncpg>=0.29.0",
    # Metrics
    "prometheus-client>=0.20.0",
    # Env
    "python-dotenv>=1.0.0",
    # Market data (free, no API key)
    "yfinance>=0.2.40",
    # Config
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/swing_trader"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
